<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>應援練習器 | Kpop 應援口號練習</title>
  <meta name="description" content="應援練習器：輸入歌手與歌曲，對照 YouTube 分段練習應援口號，幫你快速熟悉應援。">
  <meta name="keywords"
    content="應援,口號,練習,粉絲,YouTube,分段,應援詞,應援練習器,Kpop,K-pop,韓團,韓星,粉絲應援,應援歌詞,fan chant,Kpop 應援,Kpop 練習,韓流">
  <meta name="robots" content="index,follow">
  <meta name="author" content="應援練習器">
  <meta property="og:title" content="應援練習器 | Kpop 應援口號練習">
  <meta property="og:description" content="輸入歌手與歌曲，對照影片分段練習應援口號，幫你快速熟悉應援。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="應援練習器">
  <meta property="og:url" content="https://jessiesweb.github.io/CheeringGuide/">
  <meta property="og:image" content="https://jessiesweb.github.io/CheeringGuide/fb.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://jessiesweb.github.io/CheeringGuide/fb.jpg">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://jessiesweb.github.io/CheeringGuide/" />
  <meta name="msapplication-TileImage" content="https://jessiesweb.github.io/CheeringGuide/favicon.png">
  <link rel="icon" href="https://jessiesweb.github.io/CheeringGuide/favicon.png" type="image/x-icon">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "應援練習器",
      "description": "輸入歌手與歌曲，對照影片分段練習應援口號，提供提示、倒數、排行榜與結果檢視。",
      "url": "https://jessiesweb.github.io/CheeringGuide/",
      "inLanguage": "zh-TW",
      "image": "https://jessiesweb.github.io/CheeringGuide/fb.jpg"
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <h1>應援練習器</h1>
  </header>

  <main>
    <section id="practice-view" class="view"></section>
    <section id="settings-view" class="view"></section>
  </main>

  <template id="settings-template">
    <div class="settings-grid">
      <form id="song-form" class="card">
        <h2>歌曲資訊</h2>
        <label>歌手 / 團體 <input name="artist" required /></label>
        <label>歌曲名稱 <input name="title" required /></label>
        <label>應援影片連結 <input name="cheerVideo" placeholder="https://www.youtube.com/watch?v=..." /></label>
        <label>應援影片起始時間 <input name="cheerStart" placeholder="0:00" /></label>
        <label>練習影片連結 <input name="plainVideo" placeholder="https://www.youtube.com/watch?v=..." required /></label>
        <label>練習影片起始時間 <input name="plainStart" placeholder="0:00" value="0:00" /></label>

        <div class="list-editor" data-list="segments">
          <div class="list-header">
            <h3>應援時間段</h3>
          </div>
          <div class="bulk-field">
            <textarea id="segments-raw" placeholder="0:13-0:15 TWICE&#10;0:15-0:18 歡呼,尖叫"></textarea>
            <small>格式：0:00-0:00 應援句，每行一筆</small>
          </div>
          <ul id="segments-list" class="hidden"></ul>
        </div>

        <div class="list-editor" data-list="hints">
          <div class="list-header">
            <h3>應援提示</h3>
          </div>
          <div class="bulk-field">
            <textarea id="hints-raw" placeholder="TWICE&#10;歡呼,尖叫&#10;nature made me"></textarea>
            <small>每行一筆；同一行可用逗號分隔多個提示</small>
          </div>
          <ul id="hints-list" class="hidden"></ul>
        </div>

        <div class="list-editor" data-list="presets">
          <div class="list-header">
            <h3>預設按鈕</h3>
          </div>
          <div class="bulk-field">
            <textarea id="presets-raw" placeholder="尖叫&#10;應援詞1,應援詞2"></textarea>
            <small>格式同應援提示：每行一筆，可用逗號分隔多個</small>
          </div>
          <ul id="presets-list" class="hidden"></ul>
        </div>

        <div class="form-actions">
          <button type="submit">儲存歌曲</button>
          <button type="button" id="delete-song" class="danger">刪除歌曲</button>
        </div>
      </form>

      <aside class="card" id="song-list">
        <div class="list-header">
          <h2>已儲存歌曲</h2>
          <button type="button" id="refresh-songs" class="ghost">重新整理</button>
        </div>
        <ul></ul>
      </aside>
    </div>
  </template>

  <template id="practice-template">
    <section class="practice-layout">
      <div class="card">
        <h2>挑戰資訊</h2>
        <div id="challenge-form">
          <label>挑戰者名稱 <input id="challenger-name" placeholder="如果有上榜會顯示於排名" /></label>
          <label>選擇歌手 / 團體
            <select id="practice-artist"></select>
          </label>
          <label id="practice-song-wrapper" class="hidden">選擇歌曲
            <select id="practice-song" disabled></select>
          </label>
          <button id="start-practice" disabled>開始練習</button>
        </div>
        <div class="info-note">
          <strong>說明：</strong>
          <p>
            應援文字可填入空耳，TWICE應援曲目的段落、應援文字、空耳以「THIS IS FOR TW 應援團隊」於 YouTube 發表的
            <a href="https://www.youtube.com/watch?v=yZMmpkZVdug" target="_blank" rel="noopener noreferrer">TWICE THIS
              IS FOR 應援空耳合集</a>
            為主。
          </p>
        </div>
        <div id="challenge-summary" class="hidden">
          <p><strong>挑戰者：</strong><span id="summary-name">--</span></p>
          <p><strong>歌曲：</strong><span id="summary-song">--</span></p>
        </div>
      </div>

      <div class="card feedback-block">
        <h2>留言</h2>
        <label>許願歌曲 / 建議<input id="feedback-songwish" placeholder="有想練的歌跟建議都可以填寫在這邊呦 ( ੭ ˙ᗜ˙ )੭" /></label>
        <button type="button" id="submit-feedback" class="ghost">送出</button>
      </div>

      <div class="card video-panel">
        <h2 id="practice-title">尚未選擇歌曲</h2>
        <div id="video-container" class="video-frame"></div>
      </div>

      <div class="practice-panel" id="practice-card">
        <h2>應援操作</h2>
        <div class="video-note muted">音樂播放到<span> 應援段落 </span>前，請馬上按下「應援」或「空白鍵」並填入應援歌詞。<br>輸入字元會出現提示詞，但<span>不是</span>每一個段落都會出現完整提示詞。</div>
        <div class="cheer-controls" id="cheer-controls">
          <button id="cheer-button" class="circle" disabled>\ 應援 /</button>
          <div id="cheer-extra" class="cheer-extra hidden">
            <div class="cheer-entry" id="cheer-entry">
              <div class="cheer-input-row">
                <span id="cheer-timestamp">0:00</span>
                <div class="cheer-input-shell">
                  <input id="cheer-input" placeholder="輸入應援句 (標點以空白、大小寫不分)" autocomplete="off" disabled />
                  <div class="hint-panel">
                    <div id="hint-suggestions" class="hint-list hidden"></div>
                  </div>
                  <div class="cheer-input-actions">
                    <button id="commit-cheer" type="button" class="ghost" disabled>送出</button>
                    <button id="cancel-cheer" type="button" class="ghost secondary" disabled>取消</button>
                  </div>
                </div>
              </div>
              <div id="preset-buttons" class="preset-buttons"></div>
            </div>
            <div id="cheer-history" class="cheer-history"></div>
          </div>
        </div>
        <button id="submit-practice" disabled>送出結果</button>
      </div>
      </div>

      <div class="card hidden" id="scoreboard">
        <h2>結果</h2>
        <div id="practice-result" class="muted">尚未練習</div>
        <div id="result-details" class="result-details hidden"></div>
      </div>

      <div class="card hidden" id="ranking-card">
        <h2>排行</h2>
        <div class="ranking-header">
          <span>排名</span>
          <span>挑戰者</span>
          <span>正確率</span>
        </div>
        <div id="ranking-list" class="ranking-list"></div>
      </div>
      <div class="result-actions">
        <button id="next-song" class="ghost secondary">挑戰下一首歌</button>
        <button id="back-to-select" class="ghost">回歌曲選單</button>
      </div>
    </section>
  </template>

  <div id="guide-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="guide-instructions">
        <h2>應援操作說明</h2>
        <div class="cheer-demo modal-demo">
          <button type="button" class="circle demo" disabled aria-label="應援按鈕示意">\ 應援 /</button>
          <span>應援按鈕示意</span>
        </div>
        <ol>
          <li>音樂播放到<span> 應援段落 </span>前，請馬上按下「應援」或「空白鍵」並填入應援歌詞。</li>
        </ol>
        <div class="modal-actions">
          <button id="guide-confirm">我知道了</button>
        </div>
      </div>
      <div id="guide-countdown" class="hidden">
        <p>準備開始，倒數中…</p>
        <div class="countdown-number" id="countdown-number">3</div>
        <button id="mobile-countdown-btn" type="button" class="mobile-countdown hidden">開始應援</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-box small">
      <h2>提早結束應援？</h2>
      <p id="confirm-message">影片還沒結束，你確定要結束應援嗎？</p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="ghost secondary">再多等一下</button>
        <button id="confirm-ok" class="danger">結束應援</button>
      </div>
    </div>
  </div>


  <div id="name-warning-modal" class="modal-overlay hidden">
    <div class="modal-box small">
      <h2>名稱提醒</h2>
      <p>挑戰者名稱包含可能不適合的字詞，請重新輸入。</p>
      <div class="modal-actions">
        <button id="name-warning-ok">重新輸入</button>
      </div>
    </div>
  </div>

    </p>

      <a href="privacy.html">隱私權政策</a> ・
      <a href="about.html">關於本站</a>
    </p>
  </footer>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js" type="module"></script>
</body>

</html>
